# Configuration de Cheap Hops. Réglages personnels : config.local.yaml (non versionné), fusionné
# par-dessus celui-ci. Valeurs estimées marquées « # à ajuster ».

log_level: INFO

lastminute:
  origins: [VNO, KUN, RIX]
  days: 10                 # départs de J+0 à J+days (60 max)
  connections: true        # vols avec une escale sur billets séparés (non protégée)
  connection_min_hours: 3  # escale minimale ; jamais de nuit sur place
  destinations: []         # aéroports visés, ex. [BGY, BCN] ; vide : n'importe où
  periods: []              # ou des plages précises : [{start: 2026-12-30, end: 2027-01-02}]
  max_nights: 3
  weekend: false           # --weekend (CLI) ou case à cocher (UI)
  weekend_return_before: "12:00"   # retour du lundi : arrivée avant cette heure locale
  top: 30                  # lignes affichées par tableau
  optional_origins: [WAW, GDN, TLL]   # ajoutées avec --origins ; bus depuis Vilnius dans ground.yaml
  oneways_max: 300         # allers simples gardés (vue UI avec filtre de prix)
  alternatives: 10         # dates proposées par destination pour « toutes les dates »
  verify_routes: 30        # routes trouvées par un agrégateur dont le calendrier est lu chez Ryanair/Wizz
  wizz_routes: 30          # routes Wizz dont on lit les prix par jour (farechart, 1 POST chacune)
  pause_s: [0.3, 0.9]      # pause aléatoire entre deux requêtes d'une même source
  cache_minutes: 60        # une recherche relancée dans l'heure ne repaie pas ses requêtes
  request_budget: 320      # requêtes réseau max par recherche, toutes sources
  google:                  # complément : compagnies que Ryanair/Wizz ne couvrent pas
    enabled: false         # --google (CLI) ou case à cocher (UI) pour l'activer
    destinations: [WAW, CPH, HEL, FRA]
    dates: 2               # origines x destinations x dates = requêtes
  airbaltic:               # prix de la compagnie, au jour (sans heure)
    enabled: true
    requests: 100          # allers de chaque route directe, puis retours des moins chers
  kiwi:                    # agrégateur (prix indicatifs) : Norwegian, SAS, escales vendues par Kiwi…
    enabled: true
    returns: 10            # destinations dont le retour est cherché chez Kiwi (1 requête chacune)
