[project]
name = "cheaphops"
version = "0.0.0"
description = "Moteur local de recherche de vols pas chers au départ de VNO/KUN/RIX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.113",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock,bedrock-runtime]>=1.43.113",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
