# Bons plans Secret Flying (titres du type « Vilnius, Lithuania to Reykjavik, Iceland for only
# €66 roundtrip »). Pas de date précise : ces offres ne rejoignent pas l'assemblage, elles
# s'affichent à part. La recherche du site répond à un GET simple, sans anti-bot.
name: secretflying
mode: fetcher          # mode de départ ; bloqué ou vide -> stealthy -> dynamic
urls:
  - https://www.secretflying.com/?s=Vilnius
  - https://www.secretflying.com/?s=Riga
  - https://www.secretflying.com/?s=Tallinn
adaptive: true         # Scrapling mémorise les éléments et les relocalise si le CSS dérive
extract:
  kind: selectors
  item: article
  fields:
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  # origine, destination, prix tirés du titre ; l'origine est gardée si c'est une de `cities`
  pattern: '^(?P<origin>[^,]+),.*? to (?P<destination>[^,]+),.*?(?:only|from)\s+(?P<price>[€$£]\s?[0-9][0-9.,]*(?:\s[A-Z]{3}\b)?)'
cities: {Vilnius: VNO, Kaunas: KUN, Riga: RIX, Tallinn: TLL, Warsaw: WAW, Gdansk: GDN}
