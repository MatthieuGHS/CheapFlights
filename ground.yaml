# Trajets sol. Les arêtes sont bidirectionnelles.
# margin_min = temps pour rejoindre l'aéroport et passer la sécurité.

edges:
  - {a: VNO, b: KUN, duration_min: 90,  cost_eur: 10, margin_min: 120}   # à ajuster
  - {a: VNO, b: RIX, duration_min: 270, cost_eur: 20, margin_min: 120}   # à ajuster
  - {a: KUN, b: RIX, duration_min: 270, cost_eur: 20, margin_min: 120}   # à ajuster

metro:                      # regroupement des aéroports de destination
  radius_km: 60             # à ajuster
  transfer_cost_eur: 15     # à ajuster
  transfer_min: 90          # à ajuster
  overrides:                # prioritaires sur le rayon
    Milan: [BGY, MXP, LIN]
    London: [STN, LTN, LGW, LHR, SEN]
    Paris: [BVA, ORY, CDG]
